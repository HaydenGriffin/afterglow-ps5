name: "Bug report"
description: "Something in Afterglow for PS5 does not work as it should"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post**

        - Do not post Sony SDK files, firmware, decrypted system files, keys or links to them.
        - Remove tokens (`ma_token`, `ha_token`, `dev_requests`) from anything you paste, and any addresses you
          would rather not share.
  - type: input
    id: version
    attributes:
      label: "Afterglow version"
      description: "Settings → Status shows it; or the release tag or commit you built"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "PS5 system software version"
      description: "Leave empty if the problem is in the build or the PC preview only"
    validations:
      required: false
  - type: input
    id: enabler
    attributes:
      label: "Jailbreak and homebrew enabler, with versions"
      description: "For example the enabler and ShadowMount Plus versions you run"
    validations:
      required: false
  - type: input
    id: music_assistant
    attributes:
      label: "Music Assistant version"
      description: "Settings → About in Music Assistant's web interface"
    validations:
      required: false
  - type: dropdown
    id: source
    attributes:
      label: "Source"
      description: "Settings → Source on the PS5"
      options:
        - "This PS5 (playing on the console)"
        - "Active speaker"
        - "A chosen speaker"
        - "Not sure"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What you saw or heard, and what you expected instead"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Log or build output"
      description: "The app's log is /mnt/sandbox/PPSA99481_000/download0/hui/dev/app.log over FTP while Afterglow runs"
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Checks"
      options:
        - label: "I searched the open and closed issues for this problem."
          required: true
