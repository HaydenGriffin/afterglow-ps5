name: "Feature request"
description: "An idea or improvement for Afterglow for PS5"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post**

        - Do not post Sony SDK files, firmware, decrypted system files, keys or links to them.
        - Afterglow follows Afterglow for LG webOS. If the LG app already does what you want, say so.
        - Background music while playing games is out of scope: Afterglow is a foreground app.
  - type: textarea
    id: problem
    attributes:
      label: "What would you like to do that you cannot do now?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "How could it work?"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: "Checks"
      options:
        - label: "I searched the open and closed issues for this idea."
          required: true
